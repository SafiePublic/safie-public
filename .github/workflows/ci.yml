name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # engine-strict=true + engines.npm>=11.12.0 を満たすため npm を固定バージョンに更新
      # （Node 22 同梱の npm は 10 系のため）。サプライチェーン保護のためバージョン固定
      - run: npm install --global npm@11.12.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
